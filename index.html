<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2C1810" />
  <title>Kahve Köşesi — Menü</title>
  <meta name="description" content="Taze çekirdekten demlenen kahveler ve ev yapımı lezzetler." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="site-header">
    <p class="header-ornament">✦ Dijital Menü ✦</p>
    <h1 class="header-logo" id="cafe-name">Kahve Köşesi</h1>
    <p class="header-tagline" id="cafe-tagline">Her yudumda sıcaklık</p>
    <div class="header-divider"></div>
  </header>

  <!-- ── Kategori Navigasyonu ── -->
  <nav class="category-nav" aria-label="Menü kategorileri">
    <div class="category-scroll" id="cat-nav" role="list">
      <!-- JS ile doldurulur -->
    </div>
  </nav>

  <!-- ── Menü İçeriği ── -->
  <main class="main-content">
    <div id="menu-content">
      <!-- JS ile doldurulur -->
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <p>Afiyet olsun ☕</p>
  </footer>

  <!-- ── Scroll to Top ── -->
  <button id="scrollTop" aria-label="Sayfanın başına git" title="Yukarı çık">↑</button>

  <!-- ── Scriptler ── -->
  <script src="data/menu.js"></script>
  <script src="js/menu.js"></script>

</body>
</html>
